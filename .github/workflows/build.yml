name: Build APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Tabung Yuk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install & Build APK
        run: |
          GRADLE_FILE=$(find . -maxdepth 5 -name "gradlew" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "File gradlew tidak ditemukan!"
            exit 1
          fi
          ANDROID_DIR=$(dirname "$GRADLE_FILE")
          echo "Folder Android ditemukan di: $ANDROID_DIR"

          if [ -f "$ANDROID_DIR/../package.json" ]; then
            cd "$ANDROID_DIR/.."
            npm install
          fi

          cd "$GITHUB_WORKSPACE/$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/output-apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output-apk/tabung-yuk.apk"

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: tabung-yuk-apk
          path: output-apk/tabung-yuk.apk
