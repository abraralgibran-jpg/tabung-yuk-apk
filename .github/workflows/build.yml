name: Build APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Tabung Yuk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bungkus Web ke Android & Build APK
        run: |
          INDEX_FILE=$(find . -maxdepth 5 -name "index.html" | head -n 1)
          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: File index.html tidak ditemukan di repositori!"
            find . -maxdepth 4
            exit 1
          fi

          APP_DIR=$(dirname "$INDEX_FILE")
          echo "Folder index.html ditemukan di: $APP_DIR"
          cd "$GITHUB_WORKSPACE/$APP_DIR"

          rm -rf node_modules package.json package-lock.json capacitor.config.* android www
          mkdir -p www
          cp -r * www/ 2>/dev/null || true

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Tabung Yuk" "com.tabungyuk.app" --web-dir www
          npx cap add android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/output-apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output-apk/tabung-yuk.apk"

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: tabung-yuk-apk
          path: output-apk/tabung-yuk.apk
